# Rounded-ended slot peg-in-hole (stadium/capsule cross-section).

clearance:       0.0005
plate_size:      0.2
plate_thickness: 0.02
peg_length:      0.06
peg_height:      0.10

hole:
  type:   stadium
  width:  0.050    # 2 * half-length, matches the built-in slot(size=0.025)
  height: 0.0175   # 2 * h where h = 0.025 * 0.35
  n_cap:  8
