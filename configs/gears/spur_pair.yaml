# Default convex-collision spur gear pair.
# Visual gear meshes match hidden convex triangular-prism collision geoms.

scale: 1.0

module:                 0.003     # pitch diameter / teeth, meters
face_width:             0.008
pressure_angle_degrees: 20.0
addendum_coeff:         1.00
dedendum_coeff:         1.25
tooth_width_ratio:      0.48      # tooth thickness at pitch circle / circular pitch
backlash:               0.00015   # extra center spacing

gear_a:
  teeth:    18
  density:  7800

gear_b:
  include:  true
  teeth:    24
  density:  7800

support:
  include_axles: true
  axle_margin:   0.004

actuator:
  include: true
  gear:    0.02

friction: 0.8
condim:   3
timestep: 0.001
