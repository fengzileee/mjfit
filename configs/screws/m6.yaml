# M6 x 1.0 (ISO coarse), cylindrical head + cylindrical nut body.
# Smaller example — good for quick iteration.

scale: 1.0

major_diameter:   0.006    # D = 6 mm
pitch:            0.0010   # P = 1.0 mm (ISO M6 coarse)
thread_length:    0.012    # 12 mm engaged thread
n_starts:         1
segments_per_turn: 24
thread_form:      iso
handedness:       right
clearance:        0.0001  # 70 µm flank-normal gap (free-fit M6 class)
density:    100

bolt:
  include:         true
  shank_length:    0.005
  head_height:     0.004
  head_diameter:   0.010
  head_shape:      cylinder
  density:         7800

nut:
  include:         true
  height:          0.005
  outer_diameter:  0.010
  shell_shape:     cylinder
  shell_sectors:   16
  density:         7800

include_floor:    true
free_bolt:        true
free_nut:         false
mesh_only:        false
