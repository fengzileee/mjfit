name: publish

# Publishing a GitHub release uploads that version to PyPI, through PyPI's
# trusted publishing (no API token is stored anywhere).
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Check the release tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r\"__version__ = '([^']+)'\", open('src/mjfit/__init__.py').read())[1])")
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
